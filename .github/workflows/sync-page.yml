name: Sync BilaScript Page

on:
  push:
    paths:
      - '.github/workflows/sync-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply curated v4 information patch
        shell: bash
        run: |
          if git apply --check .github/patches/sync-page-v4-info.patch; then
            git apply .github/patches/sync-page-v4-info.patch
          elif grep -q 'ROADMAP.AFTER.V4' index.html; then
            echo 'Page content is already synchronized.'
          else
            echo 'Patch cannot be applied because index.html changed unexpectedly.' >&2
            exit 1
          fi

      - name: Commit synchronized page
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No page changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Sync BilaScript v4 info to Pages'
          git push
